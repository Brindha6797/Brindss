<!DOCTYPE html>
<html>
<head>
  <title>Free Fire Event Registration</title>
</head>
<body>

  <h2>Free Fire Event Registration Form</h2>

  <form action="/submit" method="post">

    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="ign">In-Game Name (IGN):</label><br>
    <input type="text" id="ign" name="ign" required><br><br>

    <label for="uid">Free Fire UID:</label><br>
    <input type="text" id="uid" name="uid" required><br><br>

    <label for="email">Email ID:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="mobile">Mobile Number:</label><br>
    <input type="tel" id="mobile" name="mobile" required><br><br>

    <label for="team">Team Name (if any):</label><br>
    <input type="text" id="team" name="team"><br><br>

    <label for="mode">Game Mode:</label><br>
    <input type="radio" name="mode" value="solo" required> Solo<br>
    <input type="radio" name="mode" value="duo"> Duo<br>
    <input type="radio" name="mode" value="squad"> Squad<br><br>

    <label for="region">Region:</label><br>
    <select id="region" name="region">
      <option value="north">North</option>
      <option value="south">South</option>
      <option value="east">East</option>
      <option value="west">West</option>
    </select><br><br>

    <label for="experience">How long have you been playing Free Fire?</label><br>
    <input type="text" id="experience" name="experience"><br><br>

    <label for="message">Why do you want to join this event?</label><br>
    <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

    <input type="submit" value="Register">

  </form>

</body>
</html>
